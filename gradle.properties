# IDA Pro M - Project-wide Gradle Properties
# Version 3.0.0

# Project Information
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# AndroidX / Jetpack
android.useAndroidX=true
android.enableJetifier=true

# Kotlin settings
kotlin.code.style=official
kotlin.native.cacheKind=none

# Build performance
org.gradle.daemon=true
org.gradle.workers.max=4

# Non-transitive R classes (reduces build time)
android.nonTransitiveRClass=true

# Enable Compose compiler metrics (for debugging)
# android.compose.compiler.metrics=true
# android.compose.compiler.reports=true

# Namespace support
android.defaults.buildfeatures.buildconfig=true

# SDK paths (if needed)
# sdk.dir=/path/to/android/sdk

# Signing (placeholder - use environment variables or keystore.properties)
# RELEASE_STORE_FILE=keystore/ida-pro-m-release.jks
# RELEASE_STORE_PASSWORD=
# RELEASE_KEY_ALIAS=ida-pro-m
# RELEASE_KEY_PASSWORD=

# Version info
VERSION_MAJOR=3
VERSION_MINOR=0
VERSION_PATCH=0
VERSION_BUILD=300
